<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>arduino-cli in the browser</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #111;
        --dim: #666;
        --line: #ccc;
        --accent: #0b7285;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #eee;
          --dim: #999;
          --line: #333;
          --accent: #4dabf7;
        }
      }
      body {
        margin: 0 auto;
        max-width: 62rem;
        padding: 1.5rem;
        font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--fg);
      }
      h1 {
        font-size: 1.1rem;
        margin: 0 0 0.25rem;
      }
      p.sub {
        margin: 0 0 1.5rem;
        color: var(--dim);
      }
      section {
        border-top: 1px solid var(--line);
        padding: 1rem 0;
      }
      h2 {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--dim);
        margin: 0 0 0.75rem;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        align-items: center;
      }
      input[type="text"] {
        flex: 1 1 14rem;
        padding: 0.4rem 0.5rem;
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 3px;
      }
      button {
        padding: 0.4rem 0.7rem;
        font: inherit;
        color: var(--fg);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 3px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--accent);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      ul {
        list-style: none;
        margin: 0.75rem 0 0;
        padding: 0;
      }
      li {
        display: flex;
        gap: 0.6rem;
        align-items: baseline;
        padding: 0.3rem 0;
        border-bottom: 1px solid var(--line);
      }
      li .name {
        flex: 1;
      }
      li .meta {
        color: var(--dim);
        font-size: 0.85em;
      }
      #log {
        height: 18rem;
        overflow: auto;
        margin: 0;
        padding: 0.6rem;
        border: 1px solid var(--line);
        border-radius: 3px;
        font-size: 0.85em;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #log .err {
        color: #e03131;
      }
      #log .ok {
        color: #2f9e44;
      }
      #status {
        color: var(--dim);
      }
    </style>
  </head>
  <body>
    <h1>arduino-cli, compiled to WebAssembly</h1>
    <p class="sub">
      The real CLI runs in this tab. Indexes and installed files live in IndexedDB.
      Compiling and uploading still need native tools, so those two are out of reach here.
    </p>

    <section>
      <h2>Status</h2>
      <div class="row">
        <span id="status">loading&hellip;</span>
      </div>
      <div class="row" style="margin-top: 0.6rem">
        <button id="update" disabled>Update indexes</button>
        <button id="reset" disabled>Erase stored files</button>
      </div>
    </section>

    <section>
      <h2>Indexes</h2>
      <div class="row">
        <input id="index-default" type="text" placeholder="package index URL (blank = Arduino's own)" />
      </div>
      <div class="row" style="margin-top: 0.5rem">
        <input id="index-extra" type="text" placeholder="extra package index URLs, space or comma separated" />
      </div>
      <div class="row" style="margin-top: 0.5rem">
        <input id="index-library" type="text" placeholder="library index URL (blank = Arduino's own)" />
      </div>
      <div class="row" style="margin-top: 0.5rem">
        <button id="index-apply">Save and reload</button>
      </div>
    </section>

    <section>
      <h2>Cores</h2>
      <div class="row">
        <input id="core-query" type="text" placeholder="esp32, arduino:avr, …" />
        <button id="core-search" disabled>Search</button>
        <button id="core-installed" disabled>Installed</button>
      </div>
      <ul id="cores"></ul>
    </section>

    <section>
      <h2>Libraries</h2>
      <div class="row">
        <input id="library-query" type="text" placeholder="Servo, WiFi, …" />
        <button id="library-search" disabled>Search</button>
        <button id="library-installed" disabled>Installed</button>
      </div>
      <ul id="libraries"></ul>
    </section>

    <section>
      <h2>WebSerial</h2>
      <div class="row">
        <button id="serial" disabled>Pick a serial device</button>
        <span id="serial-status" class="meta"></span>
      </div>
      <ul id="boards"></ul>
    </section>

    <section>
      <h2>Log</h2>
      <pre id="log"></pre>
    </section>

    <script src="wasm_exec.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
