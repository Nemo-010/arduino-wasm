name: Deploy

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "arduino-cli release tag; blank means the latest release"
        required: false
  schedule:
    # Follow upstream releases without anyone running anything.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resolve the arduino-cli release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo arduino/arduino-cli --json tagName -q .tagName)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build the CLI for wasm
        run: python3 scripts/update.py --tag "${{ steps.tag.outputs.tag }}"

      - name: Test the CLI
        run: node test/run.mjs

      - name: Test the page
        run: node test/page.mjs

      - name: Test the static server
        run: python3 test/serve_test.py

      - name: Test the CORS gateway
        run: python3 test/gateway_test.py

      - name: Test the gateway rewrite
        run: node test/gateway.mjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    # Never deploy from a pull request; branch name differs between repositories.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
