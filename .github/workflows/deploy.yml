name: Deploy

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "arduino-cli release tag; blank means the latest release"
        required: false
  schedule:
    # Follow upstream releases without anyone running anything.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resolve the arduino-cli release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo arduino/arduino-cli --json tagName -q .tagName)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build the CLI for wasm
        run: python3 scripts/update.py --tag "${{ steps.tag.outputs.tag }}"

      - name: Test the CLI
        run: node test/run.mjs

      - name: Test the page
        run: node test/page.mjs

      - name: Test the AVR toolchain through the CLI
        run: node test/avr.mjs

      - name: Test the page's AVR compile
        run: node test/page-compile.mjs

      - name: Test the DFU package writer
        run: node test/nrfutil.mjs

      - name: Test the page's nRF52 compile
        run: node test/page-nrf52.mjs

      # Source-level and unbuilt-tree-free: the entry point must install no
      # global Buffer and the webpack config must provide it per module. The
      # browser consequence is graded by `test/ide-page.mjs`, which needs a
      # built IDE tree and cannot run here.
      - name: Test how the services bundle gets Buffer
        run: node test/ide-buffer.mjs

      # The IDE's own client transport and its own service classes, against the wasm
      # the page ships. The tests build the same bridge the page loads, so a change
      # that only works against a hand-built wasm fails here.
      # `test/ide-client.mjs` and `test/ide-services.mjs` are not here on purpose.
      # Both drive arduino-ide's own generated gRPC client and service classes,
      # and those exist only in a built IDE tree: the extension is not published
      # to npm (the name there is a security placeholder), and its task classes
      # are TypeScript compiled into `build/arduino-ide/`. Running them in CI
      # would mean a yarn install of the whole monorepo, so they stay local and
      # their precondition is named in the README. Everything they touch that is
      # ours -- the wasm bridge, the binary transport, the response wrap -- is
      # covered here by the page tests.
      - name: Test the static server
        run: python3 test/serve_test.py

      - name: Test the CORS gateway
        run: python3 test/gateway_test.py

      - name: Test the gateway rewrite
        run: node test/gateway.mjs

      # The IDE page. Deliberately in this job rather than a second workflow:
      # every deploy publishes the whole of `web/`, so a separate IDE workflow
      # would blank `/ide/` for the length of each CLI deploy. A failure here
      # stops the deploy, which is the intent -- the build is pinned to an
      # arduino-ide tag, and a red run is how drift in that tree gets noticed.
      # Pull requests skip it: this is a yarn install of a whole monorepo.
      - uses: actions/cache@v5
        if: github.event_name != 'pull_request'
        with:
          path: build/arduino-ide
          key: arduino-ide-${{ hashFiles('scripts/build-ide.py') }}-node24

      - name: Build the IDE frontend
        if: github.event_name != 'pull_request'
        run: |
          if [ -d build/arduino-ide/electron-app ]; then
            python3 scripts/build-ide.py --no-publish --reuse
          else
            python3 scripts/build-ide.py --no-publish
          fi

      - name: Build the IDE's services bundle
        if: github.event_name != 'pull_request'
        run: python3 scripts/build-ide-services.py

      - name: Publish the IDE page into web/
        if: github.event_name != 'pull_request'
        run: python3 scripts/build-ide.py --reuse

      # Both browser tests grade the tree that gets deployed, over `file://`,
      # because this runner cannot serve it. They were local-only until the IDE
      # tree was built here; now the artefact they grade is the one in `web/`.
      - name: Find Chrome
        run: |
          for name in google-chrome google-chrome-stable chromium chromium-browser; do
            if path=$(command -v "$name"); then
              echo "ARDUINO_WASM_CHROME=$path" >> "$GITHUB_ENV"
              echo "chrome: $path"
              exit 0
            fi
          done
          echo "no Chrome on this runner, so the page cannot be graded"
          exit 1

      - name: Test the CLI page in a browser
        run: node test/page-browser.mjs

      - name: Test the IDE page in a browser
        if: github.event_name != 'pull_request'
        run: node test/ide-page.mjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    # Never deploy from a pull request; branch name differs between repositories.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
